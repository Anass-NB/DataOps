name: CD - Deploy Airflow to Astronomer

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Astronomer Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Astro CLI
        run: |
          curl -sSL https://install.astronomer.io | sudo bash

      - name: Deploy to Astronomer
        run: |
          astro deploy \
            --deployment-id "${{ secrets.ASTRO_DEPLOYMENT_ID }}" \
            --workspace-token "${{ secrets.ASTRO_API_TOKEN }}"
        env:
          ASTRONOMER_KEY_ID: "${{ secrets.ASTRO_API_TOKEN }}"
          ASTRONOMER_KEY_SECRET: "${{ secrets.ASTRO_API_TOKEN }}"
